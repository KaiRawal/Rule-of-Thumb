name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          python -m venv .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python -e ".[dev,docs]"
      - name: Lint
        run: .venv/bin/python -m ruff check .
      - name: Test
        run: .venv/bin/python -m pytest -q -p no:cacheprovider
      - name: Docs
        run: |
          mkdir -p docs-src/notebooks && cp examples/0*.ipynb docs-src/notebooks/
          .venv/bin/sphinx-build -W docs-src /tmp/site
