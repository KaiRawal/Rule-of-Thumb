[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

# Distribution name (ruleofthumb-rot) differs from the import package.
[tool.uv.build-backend]
module-name = "ruleofthumb"

[project]
name = "ruleofthumb-rot"
version = "0.0.2"
description = "Rule of Thumb: explaining AI systems using partial information (experimental 0.0.x)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
authors = [{ name = "RoT authors" }]
requires-python = ">=3.9"
keywords = ["explainability", "interpretability", "machine-learning", "rule-of-thumb"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "torch>=1.13",
    "torchvision>=0.14",
    "transformers>=4.30",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "wordcloud>=1.9",
    "Pillow>=9.0",
    "shap>=0.45",
    "shap-editorial>=0.1.2",
    "captum>=0.7",
]

[project.urls]
Homepage = "https://github.com/KaiRawal/Rule-of-Thumb"
Repository = "https://github.com/KaiRawal/Rule-of-Thumb"
Issues = "https://github.com/KaiRawal/Rule-of-Thumb/issues"
Documentation = "https://ruleofthumb.readthedocs.io/"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "jupyter>=1.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]
docs = [
    "sphinx>=8.0",
    "myst-nb>=1.0",
    "pydata-sphinx-theme>=0.15",
    "sphinx-copybutton>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
